site_name: 社区介绍
# 参考链接：https://blog.csdn.net/m0_63203517/article/details/129765689

#repo_url: https://github.com/carla-simulator/carla
#docs_dir: Docs
#edit_uri: 'edit/master/Docs/'


# 设置编译页面的链接的前缀
repo_url: https://github.com/OpenHUTB/.github

# 页面右上角添加直接编辑页面的按钮
edit_uri: edit/master/docs/

theme:
  name: readthedocs
  sticky_navigation: True
  navigation_depth: 3
  features:
    - search.suggest # 在目录栏中的搜索框中输入一些字母时推荐补全整个单词
# extra_css: [extra.css]
# 说明：docs/extra.css 从未存在，构建产物里也不会有该文件，
# 保留这行会让每个页面都产生一次 404（线上站点已实测确认）。
# 如果确实需要自定义样式，请补上 docs/extra.css 后再取消注释。



# mathjax用于单独公式展示
extra_javascript:
  # - extra.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/raphael/2.2.7/raphael.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/js-sequence-diagrams/1.0.6/sequence-diagram-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/flowchart/1.6.5/flowchart.min.js
  # js/umlconvert.js 从未存在，构建产物里也不会有该文件，
  # 保留这行会让每个页面都产生一次 404（线上站点已实测确认）。
  # 该脚本用于渲染 ```flow / ```sequence 围栏代码块，目前仓库里
  # 没有任何页面使用这两种代码块，所以直接移除引用。
# - js/umlconvert.js

plugins:
#  - mkdocs-video
  - search:
      lang: ja
      separator: '[\s\-\.]+'
      min_search_length: 3
  - bibtex:
      bib_file: refs.bib
      csl_file: nature.csl
  - mkdocs-video:
      is_video: True
      video_autoplay: True
      video_loop: True
  - mermaid2

extra:
  generator: false

hooks:
  - hooks.py

copyright: OpenHUTB 版权所有 &copy; {year}


nav:
- 首页: 'index.md'
- 贡献指南: 'CONTRIBUTING.md'
- git 教程: 'https://openhutb.github.io/git/?locale=zh_CN'
- Markdown教程: 'https://docs.github.com/zh/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax'
- 论文写作技巧: 'paper_tips.md'
- Latex文献引用编译办法: 'bib_reference_guide.md'
- 搭建自定义开发环境: 'env_conf.md'

- 远程办公: 'rustdesk_tailscale.md'

- 提问技巧: 'ask_question.md'

- 科学上网: 'https://openhutb.github.io/doc/build_carla/#internet'

# 以下为补充收录的文档页面
- 贡献相关:
    - 基于浏览器的贡献指南: 'codespace.md'
    - 注册 Github 账号: 'dev/sign_up.md'
    - PyCharm 教程: 'pycharm-tutorial.md'
    - 使用 TortoiseGit 解决冲突: 'resolve_conflict.md'
    - 合并提交: 'dev/merge_commit.md'
    - 注意事项: 'note.md'
- 工具与资源:
    - 模拟器演示：涉水效果: 'introduction.md'
    - 开源工具列表: 'tools.md'
    - Markdown 一键发布到社交平台: 'markdown2anything.md'
- 学习与论文:
    - LaTeX 参考文献编译: 'bib_reference_guide.md'
    - 本科毕业设计: 'undergraduate.md'
    - 论文成果：AVF-BEL 视听融合: 'paper/avf.md'
- 社区组织形式: 'org/architecture.md'





# - mdx_math 用于行内公式显示
markdown_extensions:
  - footnotes
  - admonition
  - mdx_math
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

