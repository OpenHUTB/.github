name: Deploy
on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # hooks.py 用 git log 生成每页的「最近一次修改」，浅克隆会让所有页面都指向合并提交。
          fetch-depth: 0

      - name: Build
        uses: OpenHUTB/actions-mkdocs@v2.0.0
        with:
          mkdocs_version: 'latest'
          requirements: 'requirements.txt'
          configfile: 'mkdocs.yml'

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
