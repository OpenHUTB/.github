<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="880" height="480" fill="#FFFFFF"/>

  <rect x="20" y="20" width="480" height="440" rx="8" fill="#F8FAFC" stroke="#C7D1DB" stroke-width="1"/>
  <text x="40" y="54" font-size="15" font-weight="600" fill="#1F2A37">世界坐标轴</text>
  <text x="40" y="76" font-size="12.5" fill="#5B6875">X / Y / Z 三个方向用三种颜色区分，几乎所有三维软件都沿用这套约定</text>

  <line x1="40" y1="130" x2="480" y2="130" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="40" y1="190" x2="480" y2="190" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="40" y1="250" x2="480" y2="250" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="40" y1="310" x2="480" y2="310" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="40" y1="370" x2="480" y2="370" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="150" y1="110" x2="150" y2="420" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="240" y1="110" x2="240" y2="420" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="330" y1="110" x2="330" y2="420" stroke="#EDF1F5" stroke-width="1"/>
  <line x1="420" y1="110" x2="420" y2="420" stroke="#EDF1F5" stroke-width="1"/>

  <line x1="150" y1="370" x2="418" y2="370" stroke="#D64545" stroke-width="2.5"/>
  <polygon points="418,370 408,365 408,375" fill="#D64545"/>
  <line x1="150" y1="370" x2="298" y2="288" stroke="#3E9B4F" stroke-width="2.5"/>
  <polygon points="298,288 288,290 294,298" fill="#3E9B4F"/>
  <line x1="150" y1="370" x2="150" y2="152" stroke="#2F6DB0" stroke-width="2.5"/>
  <polygon points="150,152 145,162 155,162" fill="#2F6DB0"/>
  <circle cx="150" cy="370" r="3" fill="#5B6875"/>

  <text x="300" y="398" text-anchor="middle" font-size="13" fill="#D64545">X 轴 · 红色 · 左右</text>
  <text x="312" y="284" font-size="13" fill="#3E9B4F">Y 轴 · 绿色 · 前后</text>
  <text x="164" y="150" font-size="13" fill="#2F6DB0">Z 轴 · 蓝色 · 上下</text>
  <text x="164" y="392" font-size="12" fill="#8B96A3">原点</text>

  <rect x="520" y="20" width="340" height="440" rx="8" fill="#F8FAFC" stroke="#C7D1DB" stroke-width="1"/>
  <text x="540" y="54" font-size="15" font-weight="600" fill="#1F2A37">小键盘切换标准视图</text>
  <text x="540" y="76" font-size="12.5" fill="#5B6875">不必手动拖动鼠标，按数字键直接跳到你想要的角度</text>

  <rect x="556" y="100" width="56" height="46" rx="5" fill="#DCE8F6" stroke="#2F6DB0" stroke-width="1.5"/>
  <text x="584" y="129" text-anchor="middle" font-size="16" font-weight="600" fill="#1B4F8A">7</text>
  <rect x="618" y="100" width="56" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1DB" stroke-width="1"/>
  <text x="646" y="129" text-anchor="middle" font-size="16" fill="#5B6875">8</text>
  <rect x="680" y="100" width="56" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1DB" stroke-width="1"/>
  <text x="708" y="129" text-anchor="middle" font-size="16" fill="#5B6875">9</text>

  <rect x="556" y="152" width="56" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1DB" stroke-width="1"/>
  <text x="584" y="181" text-anchor="middle" font-size="16" fill="#5B6875">4</text>
  <rect x="618" y="152" width="56" height="46" rx="5" fill="#DCE8F6" stroke="#2F6DB0" stroke-width="1.5"/>
  <text x="646" y="181" text-anchor="middle" font-size="16" font-weight="600" fill="#1B4F8A">5</text>
  <rect x="680" y="152" width="56" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1DB" stroke-width="1"/>
  <text x="708" y="181" text-anchor="middle" font-size="16" fill="#5B6875">6</text>

  <rect x="556" y="204" width="56" height="46" rx="5" fill="#DCE8F6" stroke="#2F6DB0" stroke-width="1.5"/>
  <text x="584" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#1B4F8A">1</text>
  <rect x="618" y="204" width="56" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1DB" stroke-width="1"/>
  <text x="646" y="233" text-anchor="middle" font-size="16" fill="#5B6875">2</text>
  <rect x="680" y="204" width="56" height="46" rx="5" fill="#DCE8F6" stroke="#2F6DB0" stroke-width="1.5"/>
  <text x="708" y="233" text-anchor="middle" font-size="16" font-weight="600" fill="#1B4F8A">3</text>

  <rect x="556" y="256" width="118" height="46" rx="5" fill="#DCE8F6" stroke="#2F6DB0" stroke-width="1.5"/>
  <text x="615" y="285" text-anchor="middle" font-size="16" font-weight="600" fill="#1B4F8A">0</text>
  <rect x="680" y="256" width="56" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1DB" stroke-width="1"/>
  <text x="708" y="285" text-anchor="middle" font-size="16" fill="#5B6875">.</text>

  <text x="540" y="330" font-size="13" font-weight="600" fill="#1F2A37">蓝色按键的含义</text>
  <text x="540" y="354" font-size="12.5" fill="#3C4450">1　前视图（正视）</text>
  <text x="540" y="376" font-size="12.5" fill="#3C4450">3　右视图</text>
  <text x="540" y="398" font-size="12.5" fill="#3C4450">7　顶视图</text>
  <text x="540" y="420" font-size="12.5" fill="#3C4450">5　在透视与正交之间切换</text>
  <text x="540" y="442" font-size="12.5" fill="#3C4450">0　切到摄像机视角</text>
</svg>
