  <polygon points="72,300 68,308 76,308" fill="#2F6DB0"/>
  <circle cx="72" cy="344" r="2.5" fill="#5B6875"/>
  <text x="128" y="349" font-size="12" fill="#D64545">X</text>
  <text x="104" y="318" font-size="12" fill="#3E9B4F">Y</text>
  <text x="66" y="294" font-size="12" fill="#2F6DB0">Z</text>

  <rect x="572" y="72" width="286" height="142" rx="6" fill="#F8FAFC" stroke="#C7D1DB" stroke-width="1"/>
  <text x="588" y="98" font-size="15" font-weight="600" fill="#1F2A37">大纲视图（Outliner）</text>
  <text x="588" y="119" font-size="12.5" fill="#5B6875">场景中所有物体的列表</text>
  <rect x="588" y="132" width="14" height="14" rx="2" fill="#D9E2EC" stroke="#B8C5D3" stroke-width="1"/>
  <text x="612" y="144" font-size="12.5" fill="#1F2A37">Cube</text>
  <rect x="588" y="156" width="14" height="14" rx="2" fill="#D9E2EC" stroke="#B8C5D3" stroke-width="1"/>
  <text x="612" y="168" font-size="12.5" fill="#1F2A37">Camera</text>
  <rect x="588" y="180" width="14" height="14" rx="2" fill="#D9E2EC" stroke="#B8C5D3" stroke-width="1"/>
  <text x="612" y="192" font-size="12.5" fill="#1F2A37">Light</text>

  <rect x="572" y="224" width="286" height="148" rx="6" fill="#F8FAFC" stroke="#C7D1DB" stroke-width="1"/>
  <text x="588" y="250" font-size="15" font-weight="600" fill="#1F2A37">属性编辑器（Properties）</text>
  <text x="588" y="271" font-size="12.5" fill="#5B6875">材质、修改器与渲染参数</text>
  <line x1="588" y1="288" x2="842" y2="288" stroke="#E1E8EF" stroke-width="1"/>
  <text x="588" y="308" font-size="12.5" fill="#1F2A37">材质 Material</text>
  <rect x="588" y="318" width="180" height="10" rx="3" fill="#E4EBF2"/>
  <text x="588" y="350" font-size="12.5" fill="#1F2A37">修改器 Modifier</text>
  <rect x="588" y="358" width="120" height="10" rx="3" fill="#E4EBF2"/>

  <rect x="22" y="382" width="836" height="146" rx="6" fill="#F8FAFC" stroke="#C7D1DB" stroke-width="1"/>
  <text x="38" y="408" font-size="15" font-weight="600" fill="#1F2A37">时间轴（Timeline）</text>
  <text x="38" y="429" font-size="12.5" fill="#5B6875">播放动画、设置关键帧。只做静态模型时可以暂时忽略。</text>
  <rect x="38" y="446" width="804" height="26" rx="4" fill="#E9EFF5" stroke="#C7D1DB" stroke-width="1"/>
