  <line x1="278" y1="446" x2="278" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="326" y1="446" x2="326" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="374" y1="446" x2="374" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="422" y1="446" x2="422" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="470" y1="446" x2="470" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="518" y1="446" x2="518" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="566" y1="446" x2="566" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="614" y1="446" x2="614" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="662" y1="446" x2="662" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="710" y1="446" x2="710" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="758" y1="446" x2="758" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="806" y1="446" x2="806" y2="472" stroke="#B8C5D3" stroke-width="1"/>
  <line x1="300" y1="440" x2="300" y2="478" stroke="#D64545" stroke-width="2"/>
  <polygon points="300,440 295,432 305,432" fill="#D64545"/>

  <text x="20" y="554" font-size="12.5" fill="#5B6875">顶部标签依次为：Layout 布局、Modeling 建模、Sculpting 雕刻、Shading 着色、Animation 动画、Rendering 渲染。</text>
  <text x="20" y="573" font-size="12.5" fill="#5B6875">入门阶段主要使用 Layout 和 Modeling；每个区域都可以拖动边框改变大小。</text>
</svg>
