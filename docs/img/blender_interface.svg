  <text x="91" y="46" text-anchor="middle" font-size="12.5" fill="#1F2A37" font-weight="600">Layout</text>
  <text x="231" y="46" text-anchor="middle" font-size="12.5" fill="#5B6875">Modeling</text>
  <text x="370" y="46" text-anchor="middle" font-size="12.5" fill="#5B6875">Sculpting</text>
  <text x="510" y="46" text-anchor="middle" font-size="12.5" fill="#5B6875">Shading</text>
  <text x="649" y="46" text-anchor="middle" font-size="12.5" fill="#5B6875">Animation</text>
  <text x="788" y="46" text-anchor="middle" font-size="12.5" fill="#5B6875">Rendering</text>

  <rect x="22" y="72" width="540" height="300" rx="6" fill="#F8FAFC" stroke="#C7D1DB" stroke-width="1"/>
  <text x="38" y="98" font-size="15" font-weight="600" fill="#1F2A37">3D 视图（3D Viewport）</text>
  <text x="38" y="119" font-size="12.5" fill="#5B6875">查看、选择、移动和编辑物体。绝大多数操作都在这里完成。</text>

  <polygon points="300,180 352,210 300,240 248,210" fill="#DCE8F6" stroke="#5E7C9E" stroke-width="1"/>
  <polygon points="352,210 352,270 300,300 300,240" fill="#C3D6EC" stroke="#5E7C9E" stroke-width="1"/>
  <polygon points="248,210 300,240 300,300 248,270" fill="#AEC7E4" stroke="#5E7C9E" stroke-width="1"/>
  <polyline points="248,210 300,240 352,210" fill="none" stroke="#5E7C9E" stroke-width="1"/>
  <line x1="300" y1="240" x2="300" y2="300" stroke="#5E7C9E" stroke-width="1"/>
  <text x="300" y="330" text-anchor="middle" font-size="12.5" fill="#5B6875">默认场景中的立方体</text>

  <line x1="72" y1="344" x2="122" y2="344" stroke="#D64545" stroke-width="2"/>
  <polygon points="122,344 114,340 114,348" fill="#D64545"/>
